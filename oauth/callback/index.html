<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Opening SkyPad…</title>

<style>

:root{
  --sky:#5EC8FF;
  --sky2:#1F5BFF;

  --bg1:#eef6ff;
  --bg2:#e6f1ff;
  --bg3:#fbfdff;

  --card:rgba(255,255,255,0.76);
  --stroke:rgba(255,255,255,0.78);

  --text:#162033;
  --muted:#5e6b81;

  --shadow:0 24px 70px rgba(52,84,140,0.16);
}

*{box-sizing:border-box}

html,body{
  margin:0;
  min-height:100%;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color:var(--text);

  background:
  radial-gradient(560px 360px at 18% 10%, rgba(31,91,255,0.18), transparent 60%),
  radial-gradient(640px 420px at 82% 78%, rgba(94,200,255,0.16), transparent 60%),
  linear-gradient(135deg,var(--bg1),var(--bg2),var(--bg3));
}

body{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.wrap{
  width:min(560px,100%);
  margin:0 auto;
}

.card{
  background:var(--card);
  border:1px solid var(--stroke);
  border-radius:30px;
  padding:30px 26px 24px;
  box-shadow:var(--shadow);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  text-align:center;
}

.logoWrap{
  position:relative;
  width:92px;
  height:92px;
  margin:0 auto 16px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.logo{
  width:52px;
  height:52px;
  display:block;
  object-fit:contain;
}

.orbit{
  position:absolute;
  inset:0;
  border-radius:50%;
  border:3px solid transparent;
  border-top-color:var(--sky2);
  border-right-color:var(--sky);
  animation:spin 1.15s linear infinite;
}

@keyframes spin{
  to{ transform:rotate(360deg); }
}

.brand{
  margin:0;
  font-size:30px;
  font-weight:900;
  letter-spacing:.22em;
}

.headline{
  margin:8px 0 0;
  font-size:22px;
  font-weight:800;
  letter-spacing:-0.01em;
}

.sub{
  margin:10px auto 0;
  max-width:420px;
  font-size:14px;
  line-height:1.5;
  color:var(--muted);
}

.status{
  margin:16px 0 0;
  font-size:13px;
  font-weight:700;
  color:var(--sky2);
  min-height:18px;
}

.actions{
  display:flex;
  gap:12px;
  margin-top:20px;
  flex-wrap:wrap;
  justify-content:center;
}

button,
a.btn{
  appearance:none;
  border:none;
  border-radius:18px;
  padding:14px 16px;
  font-weight:800;
  font-size:14px;
  cursor:pointer;
  text-decoration:none;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  transition:transform .16s ease, opacity .16s ease, box-shadow .16s ease;
}

button:hover,
a.btn:hover{
  transform:translateY(-1px);
}

.primary{
  min-width:220px;
  color:#fff;
  background:linear-gradient(90deg,var(--sky2),var(--sky));
  box-shadow:0 14px 34px rgba(31,91,255,0.22);
}

.secondary{
  min-width:150px;
  color:var(--text);
  background:rgba(255,255,255,0.62);
  border:1px solid rgba(255,255,255,0.82);
}

details{
  margin-top:18px;
  text-align:left;
  background:rgba(255,255,255,0.48);
  border:1px solid rgba(255,255,255,0.74);
  border-radius:16px;
  padding:12px 14px;
}

summary{
  cursor:pointer;
  font-size:12px;
  font-weight:800;
  color:var(--muted);
  list-style:none;
}

summary::-webkit-details-marker{
  display:none;
}

.linkWrap{
  margin-top:10px;
  overflow:hidden;
}

code{
  display:block;
  font-size:12px;
  line-height:1.45;
  white-space:nowrap;
  overflow:auto hidden;
  scrollbar-width:thin;
}

.hint{
  margin:16px 0 0;
  font-size:12px;
  line-height:1.5;
  color:var(--muted);
}

/* iPhone */

@media (max-width:640px){

  .card{
    padding:24px 18px 20px;
    border-radius:24px;
  }

  .brand{
    font-size:28px;
  }

  .headline{
    font-size:19px;
  }

  .actions{
    flex-direction:column;
  }

  .primary,
  .secondary{
    width:100%;
    min-width:0;
  }
}

/* Large iPad */

@media (min-width:900px){

  .card{
    padding:34px 30px 26px;
  }

  .brand{
    font-size:32px;
  }

  .headline{
    font-size:24px;
  }

}

</style>
</head>

<body>

<div class="wrap">

<div class="card">

<div class="logoWrap">
<div class="orbit"></div>

<img src="skypad-logo.png"
     class="logo"
     alt="SkyPad Logo"
     width="52"
     height="52">

</div>

<h1 class="brand">SKYPAD</h1>

<p class="headline">Opening SkyPad…</p>

<p class="sub">
Authorization is complete. Returning you to the app.
</p>

<div class="status" id="status">
Attempting automatic handoff…
</div>

<div class="actions">
<a class="btn primary" id="openBtn" href="#">Open SkyPad</a>
<button class="secondary" id="copyBtn" type="button">Copy Link</button>
</div>

<details>
<summary>Show technical link</summary>
<div class="linkWrap">
<code id="deeplink"></code>
</div>
</details>

<p class="hint">
If SkyPad does not reopen automatically, tap “Open SkyPad”.
</p>

</div>
</div>

<script>

(function() {

const params = window.location.search || "";
const deepLink = "skypad://oauth/callback" + params;

const dlEl = document.getElementById("deeplink");
const openBtn = document.getElementById("openBtn");
const copyBtn = document.getElementById("copyBtn");
const statusEl = document.getElementById("status");

dlEl.textContent = deepLink;
openBtn.setAttribute("href", deepLink);

copyBtn.addEventListener("click", async () => {

try{
await navigator.clipboard.writeText(deepLink);
statusEl.textContent = "Link copied.";
setTimeout(()=>{
statusEl.textContent =
"Tap 'Open SkyPad' if the app did not reopen automatically.";
},1400);
}
catch(e){
statusEl.textContent =
"Copy failed. Long press the link to copy it manually.";
}

});

const key = "skypad_redirected_once";
const already = sessionStorage.getItem(key) === "1";

if(!already){
sessionStorage.setItem(key,"1");
window.location.replace(deepLink);
}
else{
statusEl.textContent =
"Tap 'Open SkyPad' if the app did not reopen automatically.";
}

})();

</script>

</body>
</html>
