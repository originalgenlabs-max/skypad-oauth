<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Opening SkyPad…</title>
  <style>
    :root{
      --bg1:#eef6ff;
      --bg2:#e6f1ff;
      --bg3:#fbfdff;

      --card:rgba(255,255,255,0.76);
      --stroke:rgba(255,255,255,0.78);

      --text:#162033;
      --muted:#5e6b81;

      --sky:#4b84ff;
      --sky2:#2f63ea;
      --gold:#f3be57;
      --mint:#76d7d0;

      --shadow:0 24px 70px rgba(52,84,140,0.16);
    }

    *{box-sizing:border-box}

    html,body{
      margin:0;
      min-height:100%;
      font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      color:var(--text);
      background:
        radial-gradient(560px 360px at 18% 10%, rgba(75,132,255,0.18), transparent 60%),
        radial-gradient(640px 420px at 82% 78%, rgba(118,215,208,0.14), transparent 60%),
        radial-gradient(260px 220px at 72% 14%, rgba(243,190,87,0.12), transparent 60%),
        linear-gradient(135deg, var(--bg1), var(--bg2), var(--bg3));
    }

    body{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
      overflow:hidden;
    }

    .stars{
      position:fixed;
      inset:0;
      pointer-events:none;
      opacity:.55;
    }

    .stars i{
      position:absolute;
      width:2px;
      height:2px;
      border-radius:50%;
      background:rgba(255,255,255,0.88);
      box-shadow:0 0 0 3px rgba(255,255,255,0.08);
    }

    .wrap{
      width:min(560px, 100%);
      position:relative;
      z-index:1;
    }

    .halo{
      position:absolute;
      inset:auto 0 6% 0;
      margin:auto;
      width:360px;
      height:360px;
      border-radius:50%;
      background:radial-gradient(circle at center, rgba(75,132,255,0.20), transparent 56%);
      filter:blur(18px);
      pointer-events:none;
    }

    .card{
      position:relative;
      z-index:1;
      background:var(--card);
      border:1px solid var(--stroke);
      border-radius:30px;
      padding:28px 24px 22px;
      box-shadow:var(--shadow);
      backdrop-filter:blur(18px);
      -webkit-backdrop-filter:blur(18px);
      text-align:center;
    }

    .mark{
      position:relative;
      width:92px;
      height:92px;
      margin:0 auto 16px;
      border-radius:50%;
      background:rgba(255,255,255,0.56);
      border:1px solid rgba(255,255,255,0.68);
      display:flex;
      align-items:center;
      justify-content:center;
      box-shadow:0 16px 40px rgba(75,132,255,0.14);
      overflow:hidden;
    }

    .mark::before{
      content:"";
      position:absolute;
      inset:16px;
      border-radius:50%;
      border:2px solid rgba(243,190,87,0.48);
    }

    .mark::after{
      content:"";
      position:absolute;
      inset:10px;
      border-radius:50%;
      background:radial-gradient(circle at center, rgba(75,132,255,0.22), transparent 62%);
    }

    .mark span{
      position:relative;
      z-index:1;
      font-size:34px;
      line-height:1;
    }

    .orbit{
      position:absolute;
      inset:9px;
      border-radius:50%;
      border:3px solid transparent;
      border-top-color:var(--sky);
      border-right-color:var(--gold);
      animation:spin 1.15s linear infinite;
    }

    @keyframes spin{
      to{ transform:rotate(360deg); }
    }

    .brand{
      margin:0;
      font-size:31px;
      font-weight:900;
      letter-spacing:.22em;
    }

    .headline{
      margin:8px 0 0;
      font-size:22px;
      font-weight:800;
      letter-spacing:-0.02em;
    }

    .sub{
      margin:10px auto 0;
      max-width:420px;
      font-size:14px;
      line-height:1.5;
      color:var(--muted);
    }

    .status{
      margin:16px 0 0;
      font-size:13px;
      font-weight:700;
      color:var(--sky2);
      min-height:18px;
    }

    .actions{
      display:flex;
      gap:12px;
      margin-top:20px;
      flex-wrap:wrap;
      justify-content:center;
    }

    button,
    a.btn{
      appearance:none;
      border:none;
      border-radius:18px;
      padding:14px 16px;
      font-weight:800;
      font-size:14px;
      cursor:pointer;
      text-decoration:none;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      transition:transform .16s ease, opacity .16s ease;
    }

    button:hover,
    a.btn:hover{
      transform:translateY(-1px);
    }

    .primary{
      min-width:220px;
      color:#fff;
      background:linear-gradient(90deg, var(--sky2), var(--sky), var(--gold));
      box-shadow:0 14px 34px rgba(75,132,255,0.22);
    }

    .secondary{
      min-width:150px;
      color:var(--text);
      background:rgba(255,255,255,0.62);
      border:1px solid rgba(255,255,255,0.82);
    }

    details{
      margin-top:18px;
      text-align:left;
      background:rgba(255,255,255,0.48);
      border:1px solid rgba(255,255,255,0.74);
      border-radius:16px;
      padding:12px 14px;
    }

    summary{
      cursor:pointer;
      font-size:12px;
      font-weight:800;
      color:var(--muted);
      list-style:none;
    }

    summary::-webkit-details-marker{
      display:none;
    }

    .linkWrap{
      margin-top:10px;
      overflow:hidden;
    }

    code{
      display:block;
      color:rgba(22,32,51,0.88);
      font-size:12px;
      line-height:1.45;
      white-space:nowrap;
      overflow:auto hidden;
      scrollbar-width:thin;
    }

    .hint{
      margin:16px 0 0;
      font-size:12px;
      color:var(--muted);
      line-height:1.5;
    }

    @media (max-width:640px){
      .card{ padding:24px 18px 20px; border-radius:24px; }
      .brand{ font-size:28px; }
      .headline{ font-size:19px; }
      .actions{ flex-direction:column; }
      .primary,.secondary{ width:100%; min-width:0; }
    }
  </style>
</head>
<body>
  <div class="stars" aria-hidden="true">
    <i style="left:14%;top:18%"></i>
    <i style="left:22%;top:26%"></i>
    <i style="left:78%;top:20%"></i>
    <i style="left:86%;top:34%"></i>
    <i style="left:68%;top:74%"></i>
    <i style="left:28%;top:82%"></i>
    <i style="left:52%;top:10%"></i>
    <i style="left:60%;top:86%"></i>
  </div>

  <div class="wrap">
    <div class="halo"></div>

    <div class="card">
      <div class="mark">
        <div class="orbit"></div>
        <span>🧭</span>
      </div>

      <h1 class="brand">SKYPAD</h1>
      <p class="headline">Opening SkyPad…</p>
      <p class="sub">
        Authorization is complete. We’re handing you back to the app now.
      </p>

      <div class="status" id="status">Attempting automatic handoff…</div>

      <div class="actions">
        <a class="btn primary" id="openBtn" href="#">Open SkyPad</a>
        <button class="secondary" id="copyBtn" type="button">Copy Link</button>
      </div>

      <details>
        <summary>Show technical link</summary>
        <div class="linkWrap">
          <code id="deeplink"></code>
        </div>
      </details>

      <p class="hint">
        If SkyPad does not reopen automatically, tap “Open SkyPad”.
      </p>
    </div>
  </div>

  <script>
    (function() {
      const params = window.location.search || "";
      const deepLink = "skypad://oauth/callback" + params;

      const dlEl = document.getElementById("deeplink");
      const openBtn = document.getElementById("openBtn");
      const copyBtn = document.getElementById("copyBtn");
      const statusEl = document.getElementById("status");

      dlEl.textContent = deepLink;
      openBtn.setAttribute("href", deepLink);

      copyBtn.addEventListener("click", async () => {
        try {
          await navigator.clipboard.writeText(deepLink);
          statusEl.textContent = "Link copied.";
          setTimeout(() => {
            statusEl.textContent = "Tap “Open SkyPad” if the app did not reopen automatically.";
          }, 1400);
        } catch (e) {
          statusEl.textContent = "Copy failed. Long-press the link to copy it manually.";
        }
      });

      const key = "skypad_redirected_once";
      const already = sessionStorage.getItem(key) === "1";

      if (!already) {
        sessionStorage.setItem(key, "1");
        window.location.replace(deepLink);
      } else {
        statusEl.textContent = "Tap “Open SkyPad” if the app did not reopen automatically.";
      }
    })();
  </script>
</body>
</html>
